name: CI

on:
  push:
    branches: [dev]
    paths-ignore:
      - 'website/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [dev]
    paths-ignore:
      - 'website/**'
      - '.github/workflows/pages.yml'

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: bun install

      - run: bun install
        working-directory: packages/server

      - run: npm install
        working-directory: packages/desktop

      - run: npm run check

      - run: bun test
        working-directory: packages/server
