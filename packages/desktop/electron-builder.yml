productName: "Persona"

appId: com.feurther.persona

afterPack: scripts/after-pack.mjs

artifactName: "Persona-${os}-${arch}-${version}.${ext}"

extraResources:
  - from: "../server/dist/persona-agent-server"
    to: "bin/persona-agent-server"
  - from: "../server/dist/persona-agent-server.exe"
    to: "bin/persona-agent-server.exe"
  - from: "../server/bin/cloudflared"
    to: "bin/cloudflared"
    filter:
      - "**/*"
  - from: "../server/bin/cloudflared.exe"
    to: "bin/cloudflared.exe"
    filter:
      - "**/*"

publish:
  provider: github
  owner: Code-MonkeyZhang
  repo: persona-agent

mac:
  icon: "build/icon-mac.png"
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize:
    teamId: VPQQH7FP84
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

win:
  icon: "build/icon-win.png"
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
