productName: "Persona"

appId: com.feurther.persona

afterPack: scripts/after-pack.mjs

# 依赖全部为纯 JS（无原生模块），且由根目录 bun install 统一安装。
# 不设 false 时 electron-builder 会在包目录缺 node_modules 时尝试 npm 重装生产依赖，
# 该步骤会把 npm_execpath（bun 二进制）当脚本传给 node 执行而报 SyntaxError。
npmRebuild: false

artifactName: "Persona-${os}-${arch}-${version}.${ext}"

extraResources:
  - from: "../server/dist/persona-agent-server"
    to: "bin/persona-agent-server"
  - from: "../server/dist/persona-agent-server.exe"
    to: "bin/persona-agent-server.exe"
  - from: "../server/bin/cloudflared"
    to: "bin/cloudflared"
    filter:
      - "**/*"
  - from: "../server/bin/cloudflared.exe"
    to: "bin/cloudflared.exe"
    filter:
      - "**/*"
  # 初始 Agent 播种模板（双语言档案 + assets），随 app 打包保证离线可用
  - from: "../server/templates"
    to: "templates"
    filter:
      - "**/*"

publish:
  provider: github
  owner: Code-MonkeyZhang
  repo: persona-agent

mac:
  icon: "build/icon-mac.png"
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize:
    teamId: VPQQH7FP84
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

win:
  icon: "build/icon-win.png"
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
